plugins { id 'com.android.application' version '8.7.3' }
def withWhisper = providers.gradleProperty('withWhisper').orElse('false').get() == 'true'
android {
    namespace 'dev.tavo.engine'
    compileSdk 35
    defaultConfig { applicationId 'dev.tavo.engine'; minSdk 26; targetSdk 34; versionCode 2; versionName '0.2.0' }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    if (withWhisper) {
        ndkVersion '27.3.13750724'
        defaultConfig {
            ndk { abiFilters 'arm64-v8a' }
            externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release', '-DANDROID_STL=c++_shared', '-DANDROID_SUPPORT_FLEXIBLE_PAGE_SIZES=ON' } }
        }
        externalNativeBuild { cmake { path file('src/main/cpp/CMakeLists.txt'); version '3.31.5' } }
    }
}
dependencies { implementation 'com.google.mlkit:image-labeling:17.0.9' }
