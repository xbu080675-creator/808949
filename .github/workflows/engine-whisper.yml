name: Build Multimodal Engine APK (Whisper ARM64)
on:
  push:
    paths: ['engine/**', '.github/workflows/engine-whisper.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      APK_NAME: Multimodal-Engine-v0.4.0-whisper-arm64-debug.apk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Locate preinstalled Android SDK
        id: sdk
        shell: bash
        run: |
          for sdk in "${ANDROID_HOME:-}" "${ANDROID_SDK_ROOT:-}" /usr/local/lib/android/sdk; do
            if [[ -n "$sdk" && -f "$sdk/platforms/android-35/android.jar" && -x "$sdk/build-tools/34.0.0/aapt2" && -x "$sdk/build-tools/35.0.0/apksigner" ]]; then
              echo "ANDROID_HOME=$sdk" >> "$GITHUB_ENV"
              echo "ANDROID_SDK_ROOT=$sdk" >> "$GITHUB_ENV"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "Using installed SDK: $sdk"
              exit 0
            fi
          done
          echo "ready=false" >> "$GITHUB_OUTPUT"
      - name: Install missing SDK components only
        if: steps.sdk.outputs.ready != 'true'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;34.0.0 build-tools;35.0.0'
          accept-android-sdk-licenses: 'true'
      - name: Verify Android SDK
        shell: bash
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "SDK path: $SDK"
          ls -la "$SDK"
          ls -la "$SDK/platforms" "$SDK/build-tools"
          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/34.0.0/aapt2"
          test -x "$SDK/build-tools/35.0.0/apksigner"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          printf 'sdk.dir=%s\n' "$SDK" > engine/local.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Validate Java core and timeline regression
        run: |
          javac -d /tmp/mcp-check engine/app/src/main/java/dev/tavo/engine/McpServer.java engine/app/src/main/java/dev/tavo/engine/Timeline.java engine/tests/TimelineTest.java
          java -cp /tmp/mcp-check dev.tavo.engine.TimelineTest
      - name: Check native build tools
        shell: bash
        run: |
          SDK="$ANDROID_HOME"
          if [[ ! -f "$SDK/ndk/27.3.13750724/source.properties" || ! -x "$SDK/cmake/3.31.5/bin/cmake" ]]; then
            manager=$(find "$SDK/cmdline-tools" -path '*/bin/sdkmanager' -type f | sort -V | tail -n 1)
            test -n "$manager"
            "$manager" --sdk_root="$SDK" 'ndk;27.3.13750724' 'cmake;3.31.5'
          fi
          test -f "$SDK/ndk/27.3.13750724/source.properties"
          test -x "$SDK/cmake/3.31.5/bin/cmake"
      - name: Compile debug APK
        run: gradle -p engine :app:assembleDebug -PwithWhisper=true --no-daemon --stacktrace
      - name: Verify APK signature
        run: |
          APK=engine/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          unzip -l "$APK" | grep 'lib/arm64-v8a/libtavo_whisper.so'
          cp "$APK" "$GITHUB_WORKSPACE/$APK_NAME"
          test -s "$GITHUB_WORKSPACE/$APK_NAME"
          ls -lh "$GITHUB_WORKSPACE/$APK_NAME"
          sha256sum "$GITHUB_WORKSPACE/$APK_NAME"
      - uses: actions/upload-artifact@v4
        with:
          name: Multimodal-Engine-v0.4.0-whisper-arm64
          path: ${{ github.workspace }}/${{ env.APK_NAME }}
          if-no-files-found: error
