name: Build Multimodal Engine APK
on:
  push:
    paths: ['engine/**', '.github/workflows/engine.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35 SDK and build tools
        run: |
          command -v sdkmanager
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
          test -f "$ANDROID_HOME/platforms/android-35/android.jar"
          test -x "$ANDROID_HOME/build-tools/35.0.0/apksigner"
      - run: gradle -p engine :app:assembleDebug
      - run: |
          APK=engine/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          cp "$APK" Multimodal-Engine-v0.1.0-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Multimodal-Engine-v0.1.0
          path: Multimodal-Engine-v0.1.0-debug.apk
